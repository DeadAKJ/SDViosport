name: Build Stardew Valley iOS IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      include_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install .NET iOS Workload
        run: |
          dotnet workload install ios --skip-manifest-update

      - name: Restore NuGet Packages
        run: |
          dotnet restore src/SDViOS/SDViOS.csproj -p:CheckEolWorkloads=false -p:CheckEolTargetFramework=false

      - name: Build and Publish iOS App
        run: |
          dotnet publish src/SDViOS/SDViOS.csproj \
            -f net8.0-ios17.5 \
            -c Release \
            -p:Platform=iPhone \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:ArchiveOnBuild=false \
            -p:EnableCodeSigning=false \
            -p:CodesignKey="" \
            -p:CodesignProvision="" \
            -p:CheckEolWorkloads=false \
            -p:CheckEolTargetFramework=false \
            -o ./publish

      - name: Package IPA
        run: |
          mkdir -p ipa_staging/Payload
          APP_PATH=$(find ./publish -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app folder not found in ./publish"
            exit 1
          fi
          echo "Found app bundle at: $APP_PATH"
          codesign --force --deep --sign - --entitlements src/SDViOS/Entitlements.plist "$APP_PATH"
          cp -R "$APP_PATH" ipa_staging/Payload/
          cd ipa_staging
          zip -r -q ../StardewValley-iOS.ipa Payload
          cd ..
          ls -lh StardewValley-iOS.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StardewValley-iOS
          path: StardewValley-iOS.ipa
          retention-days: 14

      - name: Create GitHub Release
        if: ${{ inputs.include_release || startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: StardewValley-iOS.ipa
          tag_name: ${{ github.ref_name }}
          name: Stardew Valley iOS Port ${{ github.ref_name }}
          draft: false
          prerelease: false
